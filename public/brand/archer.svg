<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="An archer hits the eye of a peacock feather">
  <line x1="10" y1="110" x2="232" y2="110" stroke="#dde7ec" stroke-width="2" stroke-linecap="round"/>
  <!-- feather shaft -->
  <path d="M206 108 C204 96 202 88 200 78" stroke="#8aa3ae" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- feather barbs -->
  <g stroke="#9ed9c9" stroke-width="1.4" stroke-linecap="round" opacity=".9">
    <path d="M168 34 L160 26 M166 50 L156 48 M168 66 L158 72 M176 80 L170 90 M232 36 L240 30 M234 52 L242 52 M232 68 L240 74 M224 82 L230 92 M184 16 L180 6 M200 10 L200 0 M216 16 L222 6"/>
  </g>
  <!-- peacock-feather eye as the target -->
  <g transform="translate(200 50)">
    <path d="M0 -42 C14 -24 32 -12 32 8 A32 30 0 1 1 -32 8 C-32 -12 -14 -24 0 -42 Z" fill="#f0bf4c"/>
    <path d="M0 -30 C10 -18 24 -8 24 8 A24 22 0 1 1 -24 8 C-24 -8 -10 -18 0 -30 Z" fill="#0fb38f"/>
    <path d="M0 -18 C6 -10 15 -3 15 8 A15 14 0 1 1 -15 8 C-15 -3 -6 -10 0 -18 Z" fill="#0b8db3"/>
    <ellipse cx="0" cy="9" rx="7" ry="8" fill="#0a2a55"/>
    <circle cx="-2.5" cy="6" r="2" fill="#fff" opacity=".7"/>
  </g>
  <!-- flight path -->
  <path d="M86 36 Q140 16 170 44" fill="none" stroke="#7fcfe0" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
  <!-- arrow in the heart of the eye -->
  <path d="M172 45 L198 58" stroke="#0a2230" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 47 L174.5 39.5 M176 47 L168.6 48.8 M181 49.5 L179.5 42 M181 49.5 L173.6 51.3" stroke="#f0bf4c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- archer -->
  <g stroke="#0a2230" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M44 31 L40 66" stroke-width="7"/>
    <path d="M40 66 L28 106 M40 66 L54 106" stroke-width="7"/>
    <path d="M44 36 L74 36" stroke-width="6"/>
    <path d="M44 36 L30 34 L46 29" stroke-width="6"/>
  </g>
  <circle cx="47" cy="21" r="7.5" fill="#0a2230"/>
  <!-- bow and string -->
  <path d="M66 6 Q88 36 66 66" fill="none" stroke="#0a7399" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M66 6 L66 66" stroke="#8aa3ae" stroke-width="1.5"/>
</svg>
