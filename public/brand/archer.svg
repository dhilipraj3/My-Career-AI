<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="An archer's arrow lands in the gold centre of the MyCareer.AI target">
  <defs>
    <linearGradient id="arBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5d7e"/><stop offset="1" stop-color="#0b8db3"/></linearGradient>
    <linearGradient id="arGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03846d"/><stop offset="1" stop-color="#22bf9b"/></linearGradient>
    <radialGradient id="arGold" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#ffe29a"/><stop offset=".6" stop-color="#f0bf4c"/><stop offset="1" stop-color="#d9a431"/></radialGradient>
  </defs>
  <line x1="10" y1="110" x2="232" y2="110" stroke="#dde7ec" stroke-width="2" stroke-linecap="round"/>
  <!-- stand -->
  <path d="M195 88 L188 110 M211 88 L218 110" stroke="#8aa3ae" stroke-width="3.5" stroke-linecap="round"/>
  <!-- the logo's target, mirrored so its opening faces the archer -->
  <g transform="translate(236 26) scale(-1.1 1.1)">
    <path d="M47.4 51.32 A26 26 0 1 1 47.4 12.68" fill="none" stroke="url(#arBlue)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M41.37 44.63 A17 17 0 1 1 41.37 19.37" fill="none" stroke="url(#arGreen)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="30" cy="32" r="7" fill="url(#arGold)"/>
  </g>
  <!-- flight path -->
  <path d="M86 36 Q140 18 172 46" fill="none" stroke="#7fcfe0" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
  <!-- arrow in the gold centre -->
  <path d="M176 48 L201 60" stroke="#0a2230" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M177.8 48.87 L175.93 43.54 M177.8 48.87 L172.47 50.74 M181.4 50.6 L179.53 45.27 M181.4 50.6 L176.07 52.47" stroke="#07a384" stroke-width="2.4" stroke-linecap="round"/>
  <!-- impact sparks -->
  <path d="M210 54.2 L212.9 51.3 M213 61.2 L217 61.2 M210 68.2 L212.9 71.1" stroke="#f0bf4c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- archer -->
  <g stroke="#0a2230" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M44 31 L40 66" stroke-width="7"/>
    <path d="M40 66 L28 106 M40 66 L54 106" stroke-width="7"/>
    <path d="M44 36 L74 36" stroke-width="6"/>
    <path d="M44 36 L30 34 L46 29" stroke-width="6"/>
  </g>
  <circle cx="47" cy="21" r="7.5" fill="#0a2230"/>
  <!-- bow and string -->
  <path d="M66 6 Q88 36 66 66" fill="none" stroke="url(#arBlue)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M66 6 L66 66" stroke="#8aa3ae" stroke-width="1.5"/>
</svg>
